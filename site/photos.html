<script>
// Mezcla todas las piezas de todos los proyectos en una sola grilla densa
(function () {
  const all = [];
  PROJECTS.forEach((p) => {
    for (let i = 1; i <= p.count; i++) {
      const file = `${p.prefix}_${String(i).padStart(3, '0')}.jpg`;
      all.push({ src: `img/${p.slug}/${file}`, file });
    }
  });
  for (let i = all.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [all[i], all[j]] = [all[j], all[i]];
  }
  document.getElementById('photos-grid').innerHTML = all
    .map(
      (im) => `
      <div class="layout-grid-item" data-layout-grid-item>
        <img class="thumbnail portrait" src="${im.src}" alt="" loading="lazy">
        <div class="filename">${im.file}</div>
      </div>`
    )
    .join('');
})();
</script>
